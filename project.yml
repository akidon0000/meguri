name: Meguri
options:
  bundleIdPrefix: com.akidon0000
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  localizations: [en, ja]
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XSC9AJPSP3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

targets:
  Meguri:
    type: application
    platform: iOS
    sources:
      - path: Meguri
    info:
      path: Meguri/Info.plist
      properties:
        CFBundleDisplayName: Meguri
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Used to photograph artworks and places so Meguri can explain them."
        NSLocationWhenInUseUsageDescription: "Used to record where a photo was taken and to give the explanation more context."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akidon0000.meguri
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - MeguriTests
      gatherCoverageData: true

  MeguriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeguriTests
    dependencies:
      - target: Meguri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akidon0000.meguri.tests
        GENERATE_INFOPLIST_FILE: YES
